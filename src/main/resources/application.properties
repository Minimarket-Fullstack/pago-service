spring.application.name=pagos-service
server.port = 8084

spring.datasource.url=jdbc:mysql://localhost:3306/db_minimarket
spring.datasource.username=root
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.datasource.driver-class-name = com.mysql.cj.jdbc.Driver


spring.output.ansi.enabled = always

logging.level.com.minimarket = DEBUG
logging.pattern.console = %d{HH:mm:ss} [%level] %logger{20}: %msg%n
logging.file.name= logs/pagos-service.log

compra.service.url=http://localhost:8088
ventas.service.url = http://localhost:8082